name: CI

# Runs typecheck + build + full test suite on every push and PR.
# Amplify separately auto-deploys on push to main, so this workflow
# is the quality gate that runs alongside (and blocks merges via
# required status checks in branch protection).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL:   ${{ secrets.DATABASE_URL }}
  # Isolated credentials used only by the CI server and browser suite.
  AUTH_EMAIL: ci-eventbot@example.invalid
  AUTH_PASSWORD: ci-only-eventbot-password
  AUTH_SECRET: ci-only-eventbot-session-secret-32-characters-minimum

jobs:
  # ---------------------------------------------------------------
  quality:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

  # ---------------------------------------------------------------
  smoke:
    name: smoke suite (HTTP + DB parity)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Install psql (needed by scripts/smoke.sh)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Boot the dev server and wait until it's ready.
      - name: Start dev server
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          echo "DEV_PID=$!" >> $GITHUB_ENV
          for i in {1..60}; do
            if curl -sSf http://localhost:3000/overview > /dev/null 2>&1; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server didn't come up:"
          tail -50 /tmp/dev.log
          exit 1

      - name: Run smoke suite
        env:
          DEV_LOG: /tmp/dev.log
        run: bash scripts/smoke.sh http://localhost:3000

      - name: Upload dev log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-log-smoke
          path: /tmp/dev.log

      - name: Stop dev server
        if: always()
        run: kill "$DEV_PID" 2>/dev/null || true

  # ---------------------------------------------------------------
  e2e:
    name: Playwright e2e
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma generate
        run: pnpm db:generate

      - name: Install psql (for E2E cleanup helper)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start dev server
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          echo "DEV_PID=$!" >> $GITHUB_ENV
          for i in {1..60}; do
            if curl -sSf http://localhost:3000/overview > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          tail -50 /tmp/dev.log
          exit 1

      - name: Run Playwright
        env:
          BASE_URL: http://localhost:3000
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Stop dev server
        if: always()
        run: kill "$DEV_PID" 2>/dev/null || true
