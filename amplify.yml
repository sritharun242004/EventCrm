version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's Amazon Linux image ships Node 22+ and corepack; use corepack
        # to activate the pnpm version pinned by packageManager in package.json.
        - corepack enable
        - corepack prepare pnpm@11.15.1 --activate
        - pnpm --version
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm db:generate
        # Force-propagate runtime env vars to Next.js. Amplify sets these at
        # build-time; Next reads .env.production at runtime, so pipe them through.
        - env | grep -E '^(DATABASE_URL|DIRECT_URL|AUTH_EMAIL|AUTH_PASSWORD|AUTH_SECRET)=' > .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
